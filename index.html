
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Vídeos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl p-4 shadow-xl mb-6">
        <h1 class="text-xl font-bold mb-4 text-center text-pink-400">Editor de Vídeos</h1>
        
        <!-- Configurações de Perfil -->
        <div class="space-y-3 mb-4">
            <div>
                <label class="text-xs text-gray-400">Nome da Página:</label>
                <input type="text" id="inputName" value="Minha Página" placeholder="Digite o nome da página..." class="w-full bg-gray-700 p-2 rounded text-sm border border-gray-600 focus:outline-none focus:border-pink-500">
            </div>
            <div>
                <label class="text-xs text-gray-400">Nome de Utilizador (@):</label>
                <input type="text" id="inputUser" value="@minhapagina" placeholder="@seuusuario" class="w-full bg-gray-700 p-2 rounded text-sm border border-gray-600 focus:outline-none focus:border-pink-500">
            </div>
            <div>
                <label class="text-xs text-gray-400">Foto de Perfil:</label>
                <input type="file" id="inputPhoto" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-pink-600 file:text-white hover:file:bg-pink-700">
            </div>

            <!-- Campo de Link do Instagram -->
            <div class="pt-2 border-t border-gray-700">
                <label class="text-xs text-gray-400">Cole o Link do Vídeo do Instagram:</label>
                <div class="flex gap-2 mt-1">
                    <input type="url" id="instaUrl" placeholder="https://www.instagram.com/reel/..." class="flex-1 bg-gray-700 p-2 rounded text-sm border border-gray-600 focus:outline-none focus:border-pink-500">
                    <button type="button" onclick="baixarInsta()" class="bg-pink-600 hover:bg-pink-700 px-3 py-2 rounded text-xs font-semibold whitespace-nowrap">Baixar Vídeo</button>
                </div>
            </div>

            <!-- Seleção de Arquivo da Galeria -->
            <div>
                <label class="text-xs text-gray-400">Carregar Vídeo da Galeria:</label>
                <input type="file" id="inputVideo" accept="video/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700">
            </div>
        </div>
    </div>

    <!-- Pré-visualização do Vídeo com Cabeçalho -->
    <div class="relative w-full max-w-md bg-black rounded-xl overflow-hidden shadow-2xl aspect-[9/16] flex items-center justify-center">
        <video id="meuVideo" class="w-full h-full object-cover" controls playsinline></video>
        
        <!-- Cabeçalho Personalizado sobre o Vídeo -->
        <div id="cabecalho" class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/80 via-black/40 to-transparent p-3 flex items-center justify-between pointer-events-none">
            <div class="flex items-center space-x-2">
                <img id="profilePreview" src="https://via.placeholder.com/150" class="w-10 h-10 rounded-full border-2 border-white object-cover">
                <div>
                    <div class="flex items-center space-x-1">
                        <span id="displayName" class="font-bold text-sm text-white drop-shadow">Minha Página</span>
                        <i class="fa-solid fa-circle-check text-blue-400 text-xs"></i>
                    </div>
                    <span id="displayUser" class="text-xs text-gray-300 drop-shadow">@minhapagina</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputVideo = document.getElementById('inputVideo');
        const meuVideo = document.getElementById('meuVideo');
        const inputName = document.getElementById('inputName');
        const inputUser = document.getElementById('inputUser');
        const inputPhoto = document.getElementById('inputPhoto');
        const displayName = document.getElementById('displayName');
        const displayUser = document.getElementById('displayUser');
        const profilePreview = document.getElementById('profilePreview');

        inputVideo.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                meuVideo.src = URL.createObjectURL(file);
                meuVideo.play();
            }
        });

        inputName.addEventListener('input', (e) => { displayName.innerText = e.target.value || 'Minha Página'; });
        inputUser.addEventListener('input', (e) => { displayUser.innerText = e.target.value || '@minhapagina'; });

        inputPhoto.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                profilePreview.src = URL.createObjectURL(file);
            }
        });

        function baixarInsta() {
            const urlInput = document.getElementById('instaUrl');
            const url = urlInput.value.trim();
            if (url) {
                navigator.clipboard.writeText(url).catch(() => {});
                window.open('https://save-free.com/pt-pt/video-downloader/', '_blank');
            } else {
                alert('Por favor, cole o link do Instagram no campo primeiro!');
            }
        }
    </script>
</body>
</html>
