
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Vídeos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-2xl p-4 shadow-xl mb-6 border border-gray-200">
        <h1 class="text-xl font-bold mb-4 text-center text-gray-800">Editor de Vídeos</h1>
        
        <!-- Configurações de Perfil -->
        <div class="space-y-3 mb-4">
            <div>
                <label class="text-xs text-gray-500 font-semibold">Nome da Página:</label>
                <input type="text" id="inputName" value="Mikassak" class="w-full bg-gray-50 p-2 rounded text-sm border border-gray-300 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-gray-500 font-semibold">Nome de Utilizador (@):</label>
                <input type="text" id="inputUser" value="@mikassak" class="w-full bg-gray-50 p-2 rounded text-sm border border-gray-300 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-gray-500 font-semibold">Foto de Perfil:</label>
                <input type="file" id="inputPhoto" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
            </div>

            <!-- Seleção Direta de Vídeo da Galeria -->
            <div class="pt-2 border-t border-gray-200">
                <label class="text-xs font-semibold text-purple-600">Carregar Vídeo da Galeria:</label>
                <input type="file" id="inputVideo" accept="video/*" class="w-full mt-1 text-xs text-gray-500 file:mr-4 file:py-3 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700">
            </div>
        </div>
    </div>
