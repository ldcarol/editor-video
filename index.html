
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Vídeos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-white rounded-2xl p-4 shadow-xl mb-6 border border-gray-200">
        <h1 class="text-xl font-bold mb-4 text-center text-gray-800">Editor de Vídeos</h1>
        
        <!-- Configurações do Perfil e Título -->
        <div class="space-y-3 mb-4">
            <div>
                <label class="text-xs text-gray-500 font-semibold">Nome da Página:</label>
                <input type="text" id="inputName" value="Coelhofazz" class="w-full bg-gray-50 p-2 rounded text-sm border border-gray-300 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-gray-500 font-semibold">Nome de Utilizador (@):</label>
                <input type="text" id="inputUser" value="@coelhofazz" class="w-full bg-gray-50 p-2 rounded text-sm border border-gray-300 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-gray-500 font-semibold">Título / Emojis (ex: 😂):</label>
                <input type="text" id="inputTitle" value="😂😂" class="w-full bg-gray-50 p-2 rounded text-sm border border-gray-300 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-gray-500 font-semibold">Foto de Perfil:</label>
                <input type="file" id="inputPhoto" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
            </div>

            <!-- Seleção de Vídeo da Galeria -->
            <div class="pt-2 border-t border-gray-200">
                <label class="text-xs font-semibold text-purple-600">Carregar Vídeo da Galeria:</label>
                <input type="file" id="inputVideo" accept="video/*" class="w-full mt-1 text-xs text-gray-500 file:mr-4 file:py-3 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700">
            </div>
        </div>
    </div>

    <!-- Cartão com Perfil Centralizado exatamente como na Imagem -->
    <div class="w-full max-w-md bg-white rounded-2xl p-6 shadow-2xl border border-gray-200 flex flex-col items-center">
        
        <!-- Bloco de Perfil Centralizado na Tela -->
        <div class="w-full flex items-center justify-center mb-3">
            <div class="flex items-center space-x-3">
                <img id="profilePreview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-14 h-14 rounded-full object-cover border border-gray-200">
                <div class="flex flex-col text-left">
                    <div class="flex items-center space-x-1">
                        <span id="displayName" class="font-bold text-lg text-gray-900">Coelhofazz</span>
                        <svg class="w-5 h-5 text-blue-500 fill-current" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                    <span id="displayUser" class="text-sm text-gray-500 font-normal">@coelhofazz</span>
                </div>
            </div>
        </div>

        <!-- Título / Emojis Centralizados -->
        <div class="w-full text-center my-2">
            <span id="displayTitle" class="text-2xl">😂😂</span>
        </div>

        <!-- Vídeo no Meio -->
        <div class="w-full relative bg-black rounded-xl overflow-hidden aspect-[9/16] flex items-center justify-center mt-2">
            <video id="meuVideo" class="w-full h-full object-contain" controls playsinline loop></video>
        </div>
    </div>

    <!-- Dica -->
    <div class="w-full max-w-md mt-4 text-center">
        <p class="text-xs text-gray-500 bg-white p-3 rounded-xl shadow border border-gray-200">
            💡 <b>Dica:</b> Grave a tela do seu telemóvel enquanto o vídeo roda para salvar com o visual perfeitamente centralizado!
        </p>
    </div>

    <script>
        const inputVideo = document.getElementById('inputVideo');
        const meuVideo = document.getElementById('meuVideo');
        const inputName = document.getElementById('inputName');
        const inputUser = document.getElementById('inputUser');
        const inputTitle = document.getElementById('inputTitle');
        const inputPhoto = document.getElementById('inputPhoto');
        const displayName = document.getElementById('displayName');
        const displayUser = document.getElementById('displayUser');
        const displayTitle = document.getElementById('displayTitle');
        const profilePreview = document.getElementById('profilePreview');

        inputName.addEventListener('input', (e) => { 
            displayName.innerText = e.target.value || 'Coelhofazz'; 
        });
        
        inputUser.addEventListener('input', (e) => { 
            displayUser.innerText = e.target.value || '@coelhofazz'; 
        });

        inputTitle.addEventListener('input', (e) => { 
            displayTitle.innerText = e.target.value; 
        });

        inputPhoto.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                profilePreview.src = URL.createObjectURL(file);
            }
        });

        inputVideo.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                meuVideo.src = URL.createObjectURL(file);
                meuVideo.play();
            }
        });
    </script>
</body>
</html>
